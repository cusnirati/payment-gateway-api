services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.9.4
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /Simulators/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./Simulators
        target: /Simulators
      