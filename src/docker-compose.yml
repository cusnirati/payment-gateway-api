services:
  dynamodb:
    container_name: dynamodb-local
    image: amazon/dynamodb-local:3.3.1
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"

  dynamodb-init:
    image: amazon/aws-cli:2.36.46
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      AWS_DEFAULT_REGION: "eu-west-2"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do
          echo "Waiting for DynamoDB..."
          sleep 1
        done

        aws dynamodb create-table \
        --endpoint-url http://dynamodb:8000 \
        --table-name Payments \
        --attribute-definitions \
            AttributeName=PaymentId,AttributeType=S \
        --key-schema AttributeName=PaymentId,KeyType=HASH \
        --provisioned-throughput ReadCapacityUnits=1,WriteCapacityUnits=1 \
        --table-class STANDARD > /dev/null 2>&1

        aws dynamodb create-table \
        --endpoint-url http://dynamodb:8000 \
        --table-name PaymentIdempotencyKeys \
        --attribute-definitions \
            AttributeName=IdempotencyKey,AttributeType=S \
        --key-schema AttributeName=IdempotencyKey,KeyType=HASH \
        --provisioned-throughput ReadCapacityUnits=1,WriteCapacityUnits=1 \
        --table-class STANDARD > /dev/null 2>&1

        aws dynamodb update-time-to-live \
        --endpoint-url http://dynamodb:8000 \
        --table-name PaymentIdempotencyKeys \
        --time-to-live-specification Enabled=true,AttributeName=ExpiresAt > /dev/null 2>&1

        echo "local dynamodb setup completed"

  # https://github.com/wiremock/wiremock
  bank-simulator-wiremock:
    container_name: bank-simulator-wiremock
    image: wiremock/wiremock:3.13.2
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: --global-response-templating --verbose
    volumes:
      - type: bind
        source: ./Simulators/wiremock
        target: /home/wiremock

  # "docker compose up" still only starts the simulator and dynamodb instance in case you want to debug / run the api separately
  # docker compose --profile api up -d --build
  payment-gateway-api:
    container_name: payment-gateway-api
    profiles: ["api"]
    build:
      context: ..
      dockerfile: src/Dockerfile
    ports:
      - "5067:8080"
    environment:
      Bank__BaseUrl: "http://bank-simulator-wiremock:8080/"
      # the local keys "dev-key-merchant-a" / "dev-key-merchant-b", as their SHA-256
      ApiKeys__Merchants__0__MerchantId: "merchant-a"
      ApiKeys__Merchants__0__KeySha256: "c8c3a5a56d9ba1bff80c60a7d11478525838e0bef3d728fc4185aa3da1b84015"
      ApiKeys__Merchants__1__MerchantId: "merchant-b"
      ApiKeys__Merchants__1__KeySha256: "eb56dcd8cc40c7452f90e58fb83f526c4985c56cd51633ebe3f40131f0d1dd41"
      AWS__ServiceURL: "http://dynamodb:8000"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      bank-simulator-wiremock:
        condition: service_started
